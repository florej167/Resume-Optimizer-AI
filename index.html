<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeTailor AI</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#2c3e50;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

textarea{
    width:100%;
    min-height:250px;
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
    resize:vertical;
    font-size:14px;
}

.section{
    margin-bottom:25px;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}

.results{
    margin-top:30px;
    display:none;
}

.card{
    background:#f8f9fa;
    padding:20px;
    border-radius:8px;
    margin-bottom:20px;
}

.score{
    font-size:30px;
    font-weight:bold;
    color:green;
}

ul{
    line-height:1.8;
}

pre{
    white-space:pre-wrap;
    background:white;
    padding:15px;
    border-radius:8px;
    border:1px solid #ddd;
}
</style>

</head>

<body>

<div class="container">

<h1>ResumeTailor AI</h1>

<p class="subtitle">
Optimiza tu currículum para cualquier oferta de empleo
</p>

<div class="section">
<h3>Currículum Actual</h3>
<textarea id="resume" placeholder="Pega aquí tu currículum..."></textarea>
</div>

<div class="section">
<h3>Descripción del Puesto</h3>
<textarea id="job" placeholder="Pega aquí la descripción del puesto..."></textarea>
</div>

<center>
<button onclick="optimizeResume()">
Optimizar Resume
</button>
</center>

<div class="results" id="results">

<div class="card">
<h2>Compatibilidad Estimada</h2>
<div class="score" id="score"></div>
</div>

<div class="card">
<h2>Palabras Clave Encontradas</h2>
<ul id="keywords"></ul>
</div>

<div class="card">
<h2>Recomendaciones</h2>
<ul id="recommendations"></ul>
</div>

<div class="card">
<h2>Resume Optimizado</h2>
<pre id="optimizedResume"></pre>
</div>

</div>

</div>

<script>

function optimizeResume(){

let resume =
document.getElementById("resume").value.toLowerCase();

let job =
document.getElementById("job").value.toLowerCase();

if(resume.trim()==="" || job.trim()===""){
    alert("Debe completar ambos campos.");
    return;
}

const keywords = [
"quality",
"quality assurance",
"quality control",
"capa",
"compliance",
"gmp",
"investigation",
"risk assessment",
"change control",
"validation",
"manufacturing",
"leadership",
"communication",
"problem solving",
"lean",
"six sigma",
"root cause",
"documentation",
"data analysis",
"project management"
];

let foundKeywords = [];
let missingKeywords = [];

keywords.forEach(word=>{
    if(job.includes(word)){
        if(resume.includes(word)){
            foundKeywords.push(word);
        } else {
            missingKeywords.push(word);
        }
    }
});

let score = 60;
score += foundKeywords.length * 8;

if(score > 100){
    score = 100;
}

document.getElementById("score").innerHTML = score + "%";

let keywordHTML = "";

if(foundKeywords.length === 0){
    keywordHTML = "<li>No se encontraron coincidencias.</li>";
} else {
    foundKeywords.forEach(item=>{
        keywordHTML += `<li>${item}</li>`;
    });
}

document.getElementById("keywords").innerHTML = keywordHTML;

let recommendationHTML = "";

if(missingKeywords.length === 0){
    recommendationHTML = "<li>Excelente alineación con la posición.</li>";
} else {
    missingKeywords.forEach(item=>{
        recommendationHTML += `<li>Considere incluir experiencia relacionada con: <b>${item}</b></li>`;
    });
}

document.getElementById("recommendations").innerHTML = recommendationHTML;

let optimizedText = `
RESUMEN PROFESIONAL

Profesional con experiencia demostrada en áreas relacionadas con la posición solicitada. Capacidad para trabajar en entornos regulados, apoyar proyectos estratégicos y colaborar con equipos multidisciplinarios.

COMPETENCIAS CLAVE

${foundKeywords.join(", ")}

COMPETENCIAS RECOMENDADAS PARA AÑADIR

${missingKeywords.join(", ")}

EXPERIENCIA PROFESIONAL

[Actualizar esta sección resaltando logros relacionados con la posición.]

EDUCACIÓN

[Agregar información académica.]

CERTIFICACIONES

[Agregar certificaciones relevantes.]
`;

document.getElementById("optimizedResume").textContent = optimizedText;

document.getElementById("results").style.display = "block";

}
</script>

</body>
</html>
